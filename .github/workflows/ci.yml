# =============================================================================
# Velixa HR — Continuous Integration
#
# Runs automatically on GitHub every time you push or open a pull request.
# It does NOT deploy anything. It answers one question:
# "does this code still lint, build, and pass its tests?"
#
# You can watch runs under the "Actions" tab of the GitHub repo.
# A green tick means the checks passed; a red cross means something broke.
#
# A REAL POSTGRES RUNS HERE. The integration tests need one, because the
# guarantees most worth protecting are not in TypeScript at all — the exclusion
# constraint that makes overlapping leave policies impossible, and the row lock
# that stops two simultaneous requests spending the same days. A suite that
# mocked the database would pass whether or not either still worked.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you trigger a run by hand from the Actions tab.
  workflow_dispatch:

# If you push twice quickly, cancel the older run instead of queueing both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Points at the Postgres service below. The test suite derives its own
  # database name from this by appending `_test`, and creates it on first run,
  # so nothing here touches the `ci` database itself.
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
  # Long enough to satisfy start-up validation. Throwaway CI values.
  JWT_ACCESS_SECRET: 'ci-access-secret-that-is-definitely-long-enough-01'
  JWT_REFRESH_SECRET: 'ci-refresh-secret-that-is-definitely-long-enough-02'
  # Emails are written to a scratch directory rather than sent anywhere.
  EMAIL_TRANSPORT: 'file'
  EMAIL_OUTBOX_DIR: './ci-outbox'
  # 0 disables the background dispatcher, so tests drive delivery explicitly
  # and never race a timer.
  NOTIFICATION_DISPATCH_INTERVAL_MS: '0'

jobs:
  verify:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Nothing may run until the database actually accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is the strict, reproducible install, but it requires
        # package-lock.json to be committed. On a brand-new repo where the
        # lockfile has not been pushed yet, fall back to `npm install` so the
        # very first CI run still gives useful feedback.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json not found — falling back to 'npm install'. Commit the lockfile for reproducible builds."
            npm install
          fi

      - name: Generate Prisma client
        # Must run before the API is compiled: the generated client provides
        # the TypeScript types that src/ imports from '@prisma/client'.
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Check formatting
        # Advisory only — a formatting nit should not block a build.
        # Fix any warnings locally with `npm run format`. Once the codebase has
        # been formatted once and everyone has Prettier in their editor, you can
        # delete this line to make formatting a hard requirement.
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        # Unit tests plus integration tests against the Postgres service above.
        # The suite creates and migrates its own `ci_test` database.
        run: npm test
